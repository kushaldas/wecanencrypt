[package]
name = "wecanencrypt"
version = "0.14.3"
edition = "2021"
license = "MIT"
description = "Simple Rust OpenPGP library for encryption, signing, and key management."
repository = "https://github.com/kushaldas/wecanencrypt"
readme = "README.md"
keywords = ["openpgp", "encryption", "cryptography", "pgp", "gpg"]
categories = ["cryptography", "authentication"]
include = [
	"/Cargo.toml",
	"/README.md",
	"/src/**",
	"/examples/**",
	"/tests/**",
]

[features]
default = ["keystore", "network"]
keystore = ["rusqlite"]
network = ["reqwest", "sha1"]

# Card support is layered:
#
#   `card`          — transport-agnostic OpenPGP-card logic. Exposes
#                     `*_with(backend)` helpers that take any type
#                     convertible into `Box<dyn CardBackend + Send + Sync>`
#                     (see the openpgp-card crate). This layer alone is
#                     not directly usable at runtime — it has no way to
#                     enumerate or acquire a card backend — but it's
#                     what mobile consumers (e.g. libtumpa's
#                     MobileCardBackend bridging YubiKit over NFC/USB)
#                     compile against.
#
#   `card-pcsc`     — desktop backend via PC/SC. Adds
#                     `card-backend-pcsc` and the enumeration + wrapper
#                     APIs (`is_card_connected`, `list_all_cards`,
#                     `get_card_details(ident)` …) that auto-acquire a
#                     PCSC backend. `card-pcsc` implies `card`.
#
#   `card-external` — mobile / custom backend. The consumer registers a
#                     provider callback (`set_backend_provider`) that
#                     returns a `Box<dyn CardBackend + Send + Sync>` for
#                     a given ident. The same operation functions
#                     (`get_card_details`, `verify_user_pin`, …) then
#                     work, routing through the registered provider
#                     instead of PC/SC. Enumeration (`is_card_connected`,
#                     `list_all_cards`) is PCSC-only and not exposed
#                     under `card-external`.
#
# Consumers that previously enabled `card` should switch to `card-pcsc`
# — `card` alone no longer pulls in any transport.
card = ["openpgp-card", "card-backend", "secrecy", "digest", "aes", "aes-kw", "hkdf"]
card-pcsc = ["card", "card-backend-pcsc"]
card-external = ["card"]

dane = ["hickory-proto"]
draft-pqc = ["pgp/draft-pqc"]

[dependencies]
# OpenPGP implementation (rpgp)
pgp = { version = "0.19", default-features = false, features = ["bzip2"] }

# SSH key format handling
sshkeys = "0.3"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Random number generation
rand = "0.8"

# Hex encoding (used in card module for fingerprints)
hex = "0.4"

# Crypto dependencies for SSH key export and card operations
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
sha1 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
aes-kw = { version = "0.2", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = "1.8"

# Structured logging at debug level (consumers opt in via env_logger / RUST_LOG)
log = "0.4"

# SQLite key storage (optional)
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

# Network key fetching (optional)
reqwest = { version = "0.13", features = ["blocking"], optional = true }

# DNS DANE OPENPGPKEY support (optional)
hickory-proto = { version = "0.25", default-features = false, optional = true }

# Smart card support (optional)
openpgp-card = { version = "0.6", optional = true }
# The CardBackend / CardTransaction traits — separate crate from
# openpgp-card, not re-exported by it. Required by `card` so libtumpa's
# MobileCardBackend (and any other `card-external` consumer) can
# implement the trait on its own type.
card-backend = { version = "0.2", optional = true }
card-backend-pcsc = { version = "0.5", optional = true }
secrecy = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3.0"
hex-literal = "0.4"
pretty_assertions = "1"
testresult = "0.4.1"
sha2 = "0.10"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }

[package.metadata.docs.rs]
features = ["keystore", "network", "card", "dane"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "upexp"
required-features = ["card"]
